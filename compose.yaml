name: khouryconnect

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: khouryconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khouryconnect"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
